[project]
name = "ocarina-rag-e2e"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Browser tests. The playwright version must match the image tag in the Dockerfile.
    "pytest-playwright>=0.7",
    "playwright==1.55.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
