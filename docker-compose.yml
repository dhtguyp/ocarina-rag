services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    environment:
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /data/ocarina.db
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/data
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]  # only runs on demand, never with `docker compose up`

  frontend-test:
    build:
      context: ./frontend
      target: test
    profiles: ["test"]  # on demand only

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  e2e:
    build: ./e2e
    profiles: ["e2e"]  # on demand only; no depends_on, so it never starts the stack itself

volumes:
  qdrant_data:
  sqlite_data:
